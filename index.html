
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Event QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #f5f5f5;
      color: #202124;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 25px;
      margin: 12px 0;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin: 15px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #eee;
      min-height: 120px;
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 7px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.stop {
      background: #d93025;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      padding: 14px;
      margin-top: 14px;
      border-radius: 8px;
      background: #f1f3f4;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .ok {
      background: #d9f7e3 !important;
      color: #136c34;
    }

    .warn {
      background: #fff3cd !important;
      color: #7a5b00;
    }

    .bad {
      background: #fde2e1 !important;
      color: #a12622;
    }

    .counter {
      font-size: 30px;
      font-weight: bold;
      margin: 10px;
      color: #1a73e8;
    }

    .help {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

  </style>

</head>

<body>

<main>

  <h1>QR Check-in Scanner</h1>

  <p class="subtitle">
    Continuous Registration Scanning
  </p>

  <div class="card">

    <div id="reader"></div>

    <button id="startButton"
            onclick="startScanner()">
      Start Camera
    </button>

    <button id="stopButton"
            class="stop"
            onclick="stopScanner()"
            hidden>
      Stop Camera
    </button>

    <div id="status">
      Scanner is ready. Press Start Camera.
    </div>

  </div>

  <div class="card">

    <p>Successful QR scans sent</p>

    <div class="counter" id="scanCount">
      0
    </div>

    <p class="help">
      Keep this page open while checking in participants.
      The camera will remain active after each scan.
    </p>

  </div>

</main>

<script>

// ==================================================
// CONFIGURATION
// ==================================================

const SCANNER_TOKEN =
  new URLSearchParams(window.location.search).get('token');


// ==================================================
// VARIABLES
// ==================================================

let scanner = null;
let scannerRunning = false;
let starting = false;

let scanCount = 0;

const recentScans = new Map();


// ==================================================
// DISPLAY STATUS
// ==================================================

function showStatus(type, message) {

  const status = document.getElementById('status');

  status.className = type;

  status.textContent = message;

}


// ==================================================
// CHECK SESSION
// ==================================================

function checkSession() {

  if (!SCANNER_TOKEN) {

    showStatus(
      'bad',
      'Invalid scanner session. Please reopen the scanner from the main check-in page.'
    );

    document.getElementById('startButton').disabled = true;

    return false;
  }

  if (!window.opener || window.opener.closed) {

    showStatus(
      'bad',
      'Main check-in page not detected. Keep the original check-in page open and reopen this scanner.'
    );

    document.getElementById('startButton').disabled = true;

    return false;
  }

  return true;

}


// ==================================================
// START CAMERA
// ==================================================

async function startScanner() {

  if (scannerRunning || starting) {
    return;
  }

  if (!checkSession()) {
    return;
  }

  if (typeof Html5Qrcode === 'undefined') {

    showStatus(
      'bad',
      'QR scanner library failed to load. Check your internet connection.'
    );

    return;
  }

  if (!window.isSecureContext ||
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    showStatus(
      'bad',
      'Camera access is unavailable. Open this page using its HTTPS GitHub Pages URL in Chrome or Safari.'
    );

    return;
  }

  starting = true;

  document.getElementById('startButton').disabled = true;

  showStatus(
    'warn',
    'Requesting camera access...'
  );

  try {

    scanner = new Html5Qrcode('reader');

    const config = {

      fps: 10,

      qrbox: function(width, height) {

        const size = Math.floor(
          Math.min(width, height) * 0.72
        );

        return {
          width: Math.max(150, Math.min(size, 300)),
          height: Math.max(150, Math.min(size, 300))
        };

      }

    };

    try {

      // Prefer the rear camera.
      await scanner.start(
        { facingMode: 'environment' },
        config,
        onQrDetected,
        function() {}
      );

    } catch (rearError) {

      // Try available camera devices.
      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw rearError;
      }

      const preferredCamera =
        cameras.find(camera =>
          /back|rear|environment/i.test(camera.label)
        ) || cameras[cameras.length - 1];

      await scanner.start(
        preferredCamera.id,
        config,
        onQrDetected,
        function() {}
      );

    }

    scannerRunning = true;

    showStatus(
      'ok',
      'Camera is active! Point it at a registration QR code.'
    );

    document.getElementById('stopButton').hidden = false;

  } catch (error) {

    const message =
      (error && error.name ? error.name + ': ' : '') +
      (error && error.message ? error.message : String(error));

    if (scanner) {

      try {
        scanner.clear();
      } catch (e) {}

    }

    scanner = null;
    scannerRunning = false;

    showStatus(
      'bad',
      'Unable to start camera: ' + message +
      '. Check camera permission for your GitHub Pages website.'
    );

  } finally {

    starting = false;

    document.getElementById('startButton').disabled =
      scannerRunning;

  }

}


// ==================================================
// QR CODE DETECTED
// ==================================================

function onQrDetected(decodedText) {

  const id = String(decodedText || '').trim();

  if (!id) {
    return;
  }

  // Prevent repeated scans of the same code.
  const now = Date.now();

  const previousScan = recentScans.get(id) || 0;

  if (now - previousScan < 4000) {
    return;
  }

  recentScans.set(id, now);

  // Remove old entries to keep memory usage small.
  for (const [key, time] of recentScans.entries()) {

    if (now - time > 30000) {
      recentScans.delete(key);
    }

  }

  sendToMainPage(id);

}


// ==================================================
// SEND SCANNED ID TO APPS SCRIPT
// ==================================================

function sendToMainPage(id) {

  if (!window.opener || window.opener.closed) {

    showStatus(
      'bad',
      'Main check-in page was closed. Reopen it before scanning.'
    );

    return;
  }

  try {

    window.opener.postMessage({

      type: 'CHECKIN_QR',

      token: SCANNER_TOKEN,

      id: id

    }, '*');

    scanCount++;

    document.getElementById('scanCount').textContent =
      scanCount;

    showStatus(
      'ok',
      'QR code scanned: ' + id +
      '\n\nCheck-in request sent. Ready for the next participant!'
    );

  } catch (error) {

    showStatus(
      'bad',
      'Unable to send QR code to the main page: ' +
      error.message
    );

  }

}


// ==================================================
// STOP CAMERA
// ==================================================

async function stopScanner() {

  if (!scanner || !scannerRunning) {
    return;
  }

  const activeScanner = scanner;

  document.getElementById('stopButton').disabled = true;

  try {

    await activeScanner.stop();

    activeScanner.clear();

    scanner = null;
    scannerRunning = false;

    document.getElementById('stopButton').hidden = true;

    showStatus(
      'warn',
      'Camera stopped.'
    );

  } catch (error) {

    showStatus(
      'bad',
      'Unable to stop camera: ' + error.message
    );

  } finally {

    document.getElementById('stopButton').disabled = false;

    document.getElementById('startButton').disabled =
      scannerRunning;

  }

}


// ==================================================
// PAGE EXIT
// ==================================================

window.addEventListener('pagehide', function() {

  if (scanner && scannerRunning) {

    scanner.stop().catch(function() {});

  }

});


// ==================================================
// INITIALIZATION
// ==================================================

checkSession();

</script>

</body>

</html>


<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 16px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #202124;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 20px;
    }

    #reader {
      width: 100%;
      min-height: 100px;
      margin: 16px auto;
      overflow: hidden;
      border-radius: 12px;
      background: white;
    }

    #result {
      display: none;
      padding: 15px;
      margin: 16px 0;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .ok {
      background: #d9f7e3;
      color: #136c34;
    }

    .warn {
      background: #fff3cd;
      color: #7a5b00;
    }

    .bad {
      background: #fde2e1;
      color: #a12622;
    }

    .controls,
    .manual {
      margin: 16px 0;
    }

    input,
    button {
      min-height: 46px;
      padding: 12px;
      font: inherit;
      border-radius: 6px;
    }

    input {
      width: min(100%, 260px);
      border: 1px solid #777;
      background: white;
    }

    button {
      margin: 4px;
      border: none;
      background: #1a73e8;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1558b0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #8ab4f8;
      outline-offset: 2px;
    }

    .help {
      color: #5f6368;
      font-size: 14px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<main>

  <h1>Check-in Scanner</h1>

  <div class="controls">

    <button id="startButton"
            type="button"
            onclick="startScanner()">
      Start Camera
    </button>

    <button id="stopButton"
            type="button"
            onclick="stopScanner()"
            hidden>
      Stop Camera
    </button>

  </div>

  <div id="reader"
       aria-label="QR code camera view">
  </div>

  <div id="result"
       role="status"
       aria-live="polite">
  </div>

  <section class="manual">

    <p><strong>Manual Check-in</strong></p>

    <p>Camera not working? Enter the Registration ID below.</p>

    <input
      id="manualId"
      type="text"
      placeholder="REG-XXXXXXXX"
      autocomplete="off"
      autocapitalize="characters">

    <br>

    <button id="manualButton"
            type="button"
            onclick="submitManualId()">
      Check In
    </button>

  </section>

  <p class="help">
    Open the deployed HTTPS web app URL ending in /exec.
    Allow camera access when prompted.
  </p>

</main>

<script>

  var scanner = null;
  var scannerRunning = false;
  var requestInProgress = false;
  var lastScannedId = '';

  function showResult(kind, message) {

    var result = document.getElementById('result');

    result.className = kind;
    result.textContent = message;
    result.style.display = 'block';

  }

  function setCameraButtons(isRunning, isLoading) {

    document.getElementById('startButton').disabled =
      isRunning || isLoading;

    document.getElementById('stopButton').hidden =
      !isRunning;

    document.getElementById('stopButton').disabled =
      isLoading;

  }

  function errorMessage(error) {

    if (!error) {
      return 'Unknown error.';
    }

    return error.message || String(error);

  }

  function isPermissionError(error) {

    var message = errorMessage(error).toLowerCase();

    return message.includes('notallowederror') ||
           message.includes('permission denied') ||
           message.includes('permission');

  }

  function startScanner() {

    if (scannerRunning || scanner) {
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {

      showResult(
        'bad',
        'QR scanner library failed to load. Check your internet connection.'
      );

      return;
    }

    if (!window.isSecureContext) {

      showResult(
        'bad',
        'Camera access requires a secure HTTPS connection. Open your deployed Apps Script /exec URL.'
      );

      return;
    }

    setCameraButtons(false, true);

    showResult(
      'warn',
      'Requesting camera permission...'
    );

    startWithCamera_({ facingMode: 'environment' })

      .then(function() {

        showResult(
          'ok',
          'Camera connected! Point it at a registration QR code.'
        );

      })

      .catch(function(rearError) {

        if (isPermissionError(rearError)) {

          scanner = null;
          scannerRunning = false;

          setCameraButtons(false, false);

          showResult(
            'bad',
            'Camera permission denied. Open your browser site settings, allow camera access, reload this page, and try again. You can also use manual check-in.'
          );

          return;
        }

        startWithCamera_({ facingMode: 'user' })

          .then(function() {

            showResult(
              'ok',
              'Front camera connected! Point it at a registration QR code.'
            );

          })

          .catch(function(frontError) {

            scanner = null;
            scannerRunning = false;

            setCameraButtons(false, false);

            showResult(
              'bad',
              'Unable to start camera. ' +
              errorMessage(frontError) +
              '. Please check browser camera permissions or use manual check-in.'
            );

          });

      });

  }

  function startWithCamera_(cameraConstraint) {

    if (scanner) {
      clearScanner_();
    }

    scanner = new Html5Qrcode('reader');

    var activeScanner = scanner;

    return activeScanner.start(

      cameraConstraint,

      {
        fps: 10,

        qrbox: function(width, height) {

          var size = Math.floor(
            Math.min(width, height) * 0.7
          );

          size = Math.max(150, Math.min(size, 300));

          return {
            width: size,
            height: size
          };

        }

      },

      function(decodedText) {

        if (!requestInProgress &&
            decodedText !== lastScannedId) {

          lastScannedId = decodedText;

          submitId(decodedText);

        }

      },

      function() {
        // No QR code detected.
      }

    ).then(function() {

      scannerRunning = true;

      setCameraButtons(true, false);

    }).catch(function(error) {

      if (scanner === activeScanner) {
        scanner = null;
      }

      try {
        activeScanner.clear();
      } catch (e) {
        // Ignore cleanup errors.
      }

      throw error;

    });

  }

  function stopScanner() {

    if (!scanner) {
      return;
    }

    var activeScanner = scanner;

    setCameraButtons(true, true);

    if (!scannerRunning) {
      return;
    }

    activeScanner.stop()

      .then(function() {

        try {
          activeScanner.clear();
        } catch (e) {
          // Ignore cleanup errors.
        }

        if (scanner === activeScanner) {
          scanner = null;
        }

        scannerRunning = false;

        setCameraButtons(false, false);

        showResult(
          'warn',
          'Camera stopped.'
        );

      })

      .catch(function(error) {

        scanner = null;
        scannerRunning = false;

        setCameraButtons(false, false);

        showResult(
          'bad',
          'Could not stop camera: ' +
          errorMessage(error)
        );

      });

  }

  function clearScanner_() {

    if (!scanner) {
      return;
    }

    try {
      scanner.clear();
    } catch (error) {
      // Ignore cleanup errors.
    }

    scanner = null;
    scannerRunning = false;

  }

  function submitManualId() {

    var input = document.getElementById('manualId');

    var id = input.value.trim();

    if (!id) {

      showResult(
        'warn',
        'Please enter a Registration ID.'
      );

      input.focus();

      return;
    }

    submitId(id);

  }

  function submitId(rawId) {

    var id = String(rawId || '').trim();

    if (requestInProgress || !id) {
      return;
    }

    requestInProgress = true;

    document.getElementById('manualButton').disabled = true;

    showResult(
      'warn',
      'Checking registration...'
    );

    google.script.run

      .withSuccessHandler(function(response) {

        requestInProgress = false;

        document.getElementById('manualButton').disabled = false;

        if (!response) {

          showResult(
            'bad',
            'The server returned no result.'
          );

          return;
        }

        var name = response.name
          ? response.name + ': '
          : '';

        var resultClass = response.ok
          ? 'ok'
          : response.duplicate
            ? 'warn'
            : 'bad';

        showResult(
          resultClass,
          name + response.message
        );

        if (response.ok || response.duplicate) {

          document.getElementById('manualId').value = '';

          // Keep the same QR code from being processed repeatedly.
          if (response.ok) {
            lastScannedId = id;
          }

        } else {

          lastScannedId = '';

        }

      })

      .withFailureHandler(function(error) {

        requestInProgress = false;

        document.getElementById('manualButton').disabled = false;

        lastScannedId = '';

        showResult(
          'bad',
          'Check-in failed: ' + errorMessage(error)
        );

      })

      .checkIn(id);

  }

  document.getElementById('manualId')
    .addEventListener('keydown', function(event) {

      if (event.key === 'Enter') {
        submitManualId();
      }

    });

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>QR Check-in Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #f5f5f5;
      color: #202124;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 25px;
      margin: 12px 0;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin: 15px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    #reader {
      width: 100%;
      min-height: 120px;
      overflow: hidden;
      border-radius: 10px;
      background: #eee;
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 7px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.stop {
      background: #d93025;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      padding: 14px;
      margin-top: 14px;
      border-radius: 8px;
      background: #f1f3f4;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .ok {
      background: #d9f7e3 !important;
      color: #136c34;
    }

    .warn {
      background: #fff3cd !important;
      color: #7a5b00;
    }

    .bad {
      background: #fde2e1 !important;
      color: #a12622;
    }

    .counter {
      font-size: 30px;
      font-weight: bold;
      margin: 10px;
      color: #1a73e8;
    }

    .help {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    
.result-card {
  margin-top: 16px;
  padding: 22px 14px;
  border-radius: 12px;
  line-height: 1.5;
  animation: resultAppear .25s ease;
}

.result-card[hidden] {
  display: none;
}

.result-card.success {
  background: #d9f7e3;
  color: #136c34;
  border: 2px solid #16a34a;
}

.result-card.duplicate {
  background: #fff3cd;
  color: #7a5b00;
  border: 2px solid #e0a800;
}

.result-card.notfound,
.result-card.error {
  background: #fde2e1;
  color: #a12622;
  border: 2px solid #d93025;
}

.result-icon {
  font-size: 48px;
  font-weight: bold;
}

.result-card h2 {
  font-size: 21px;
  margin: 8px 0;
}

.result-name {
  font-size: 22px;
  font-weight: bold;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.result-id {
  font-size: 13px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.result-time {
  font-size: 13px;
  margin-top: 5px;
}

@keyframes resultAppear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}


  </style>

</head>

<body>

<main>

  <h1>QR Check-in Scanner</h1>

  <p class="subtitle">
    Continuous Registration Scanning
  </p>


  <!-- CAMERA -->

  <div class="card">

    <div id="reader"></div>

    <button
      id="startButton"
      type="button"
      onclick="startScanner()">

      Start Camera

    </button>

    <button
      id="stopButton"
      class="stop"
      type="button"
      onclick="stopScanner()"
      hidden>

      Stop Camera

    </button>

    <div id="status">
      Checking scanner session...
    </div>

    
<div id="checkinResult" class="result-card" hidden>

  <div id="resultIcon" class="result-icon">✓</div>

  <h2 id="resultTitle">CHECK-IN SUCCESSFUL</h2>

  <div id="resultName" class="result-name"></div>

  <p id="resultMessage"></p>

  <div id="resultId" class="result-id"></div>

  <div id="resultTime" class="result-time"></div>

</div>


  </div>


  <!-- SCAN COUNTER -->

  <div class="card">

    <p>Successful QR scans sent</p>

    <div class="counter" id="scanCount">
      0
    </div>

    <p class="help">
      Keep this page open while checking in participants.
      The camera will remain active after each scan.
    </p>

  </div>

</main>


<script>

// ==================================================
// 1. SESSION CONFIGURATION
// ==================================================

const SCANNER_TOKEN =
  new URLSearchParams(window.location.search)
    .get('token');


// ==================================================
// 2. VARIABLES
// ==================================================

let scanner = null;

let scannerRunning = false;

let starting = false;

let stopping = false;

let scanCount = 0;

const recentScans = new Map();


// ==================================================
// 3. DISPLAY STATUS
// ==================================================

function showStatus(type, message) {

  const status = document.getElementById('status');

  status.className = type;

  status.textContent = message;

}


// ==================================================
// 4. COMMUNICATE WITH APPS SCRIPT
// ==================================================

function sendToMain(data) {

  if (!window.opener || window.opener.closed) {

    showStatus(
      'bad',
      'Main check-in dashboard is not connected. Keep the original Apps Script page open and reopen this scanner.'
    );

    return false;

  }

  try {

    window.opener.postMessage({

      ...data,

      token: SCANNER_TOKEN

    }, '*');

    return true;

  } catch (error) {

    showStatus(
      'bad',
      'Connection error: ' + error.message
    );

    return false;

  }

}


// ==================================================
// 5. INITIALIZE SESSION
// ==================================================

function initializeScanner() {

  if (!SCANNER_TOKEN) {

    showStatus(
      'bad',
      'Invalid scanner session. Please open this scanner using the Open QR Scanner button in your Apps Script dashboard.'
    );

    document.getElementById('startButton').disabled = true;

    return;

  }

  if (!window.opener || window.opener.closed) {

    showStatus(
      'bad',
      'Main check-in page not detected. Keep the original dashboard open and reopen the scanner.'
    );

    document.getElementById('startButton').disabled = true;

    return;

  }

  const connected = sendToMain({

    type: 'SCANNER_READY'

  });

  if (connected) {

    showStatus(
      'ok',
      'Scanner connected successfully. Press Start Camera.'
    );

  }

}


// ==================================================
// 6. START CAMERA
// ==================================================

async function startScanner() {

  if (scannerRunning || starting || stopping) {
    return;
  }

  if (!SCANNER_TOKEN ||
      !window.opener ||
      window.opener.closed) {

    initializeScanner();

    return;

  }

  if (typeof Html5Qrcode === 'undefined') {

    showStatus(
      'bad',
      'QR scanner library failed to load. Check your internet connection.'
    );

    return;

  }

  if (
    !window.isSecureContext ||
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      'bad',
      'Camera access requires HTTPS and a supported browser. Open your published GitHub Pages URL in Chrome or Safari.'
    );

    return;

  }

  starting = true;

  document.getElementById('startButton').disabled = true;

  showStatus(
    'warn',
    'Requesting camera access...'
  );

  try {

    const config = {

      fps: 10,

      qrbox: function(width, height) {

        const size = Math.floor(
          Math.min(width, height) * 0.72
        );

        const bounded = Math.min(
          Math.max(size, 150),
          300
        );

        return {
          width: bounded,
          height: bounded
        };

      }

    };


    // First attempt: rear camera.
    scanner = new Html5Qrcode('reader');

    try {

      await scanner.start(
        { facingMode: 'environment' },
        config,
        onQrDetected,
        function() {}
      );

    } catch (rearError) {

      // Clean up failed first attempt.
      try {
        scanner.clear();
      } catch (e) {}

      scanner = null;

      // Second attempt: available cameras.
      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {

        throw rearError;

      }

      const preferredCamera =
        cameras.find(function(camera) {

          return /back|rear|environment/i.test(
            camera.label
          );

        }) || cameras[cameras.length - 1];


      scanner = new Html5Qrcode('reader');

      await scanner.start(
        preferredCamera.id,
        config,
        onQrDetected,
        function() {}
      );

    }


    scannerRunning = true;

    document.getElementById('startButton').disabled = true;

    document.getElementById('stopButton').hidden = false;

    showStatus(
      'ok',
      'Camera active! Point it at a registration QR code.'
    );

    sendToMain({

      type: 'SCANNER_STATUS',

      message: 'Camera active and ready for scanning.'

    });


  } catch (error) {

    if (scanner) {

      try {
        scanner.clear();
      } catch (e) {}

    }

    scanner = null;

    scannerRunning = false;

    let errorName = error && error.name
      ? error.name + ': '
      : '';

    let errorText = error && error.message
      ? error.message
      : String(error);

    showStatus(
      'bad',
      'Camera startup failed: ' +
      errorName +
      errorText +
      '\n\nCheck camera permission for your GitHub Pages website.'
    );

  } finally {

    starting = false;

    document.getElementById('startButton').disabled =
      scannerRunning;

  }

}


// ==================================================
// 7. DETECT QR CODE
// ==================================================

function onQrDetected(decodedText) {

  const id = String(decodedText || '').trim();

  if (!id) {
    return;
  }

  const now = Date.now();

  const previousScan = recentScans.get(id) || 0;

  // Prevent repeated scans within four seconds.
  if (now - previousScan < 4000) {
    return;
  }

  recentScans.set(id, now);

  // Remove old scan records.
  for (const [key, time] of recentScans.entries()) {

    if (now - time > 30000) {

      recentScans.delete(key);

    }

  }

  sendQrCode(id);

}


// ==================================================
// 8. SEND QR CODE TO APPS SCRIPT
// ==================================================

function sendQrCode(id) {

  const sent = sendToMain({

    type: 'CHECKIN_QR',

    id: id

  });

  if (!sent) {
    return;
  }

  scanCount++;

  document.getElementById('scanCount').textContent =
    scanCount;

  showStatus(
    'ok',
    'QR code scanned: ' + id +
    '\n\nCheck-in request sent. Ready for the next participant!'
  );

}

  
function displayCheckInResult(data) {

  const response = data.result || {};

  const card = document.getElementById('checkinResult');

  const icon = document.getElementById('resultIcon');

  const title = document.getElementById('resultTitle');

  const name = document.getElementById('resultName');

  const message = document.getElementById('resultMessage');

  const id = document.getElementById('resultId');

  const time = document.getElementById('resultTime');

  card.className = 'result-card';

  if (response.ok) {

    card.classList.add('success');

    icon.textContent = '✓';

    title.textContent = 'CHECK-IN SUCCESSFUL';

  } else if (response.duplicate) {

    card.classList.add('duplicate');

    icon.textContent = '⚠';

    title.textContent = 'ALREADY CHECKED IN';

  } else if (response.notFound) {

    card.classList.add('notfound');

    icon.textContent = '✕';

    title.textContent = 'REGISTRATION NOT FOUND';

  } else {

    card.classList.add('error');

    icon.textContent = '✕';

    title.textContent = 'CHECK-IN ERROR';

  }

  name.textContent = response.name || 'Participant';

  message.textContent =
    response.message || 'No additional information.';

  id.textContent =
    'Registration ID: ' + (data.id || '');

  time.textContent = response.checkInTime
    ? 'Check-in time: ' + response.checkInTime
    : '';

  card.hidden = false;

}



// ==================================================
// 9. STOP CAMERA
// ==================================================

async function stopScanner() {

  if (!scanner || !scannerRunning || stopping) {
    return;
  }

  stopping = true;

  const activeScanner = scanner;

  document.getElementById('stopButton').disabled = true;

  try {

    await activeScanner.stop();

    activeScanner.clear();

    scanner = null;

    scannerRunning = false;

    document.getElementById('stopButton').hidden = true;

    showStatus(
      'warn',
      'Camera stopped.'
    );

  } catch (error) {

    showStatus(
      'bad',
      'Unable to stop camera: ' + error.message
    );

  } finally {

    stopping = false;

    document.getElementById('stopButton').disabled = false;

    document.getElementById('startButton').disabled =
      scannerRunning;

  }

}


// ==================================================
// 10. CLEANUP WHEN LEAVING PAGE
// ==================================================

window.addEventListener('pagehide', function() {

  if (scanner && scannerRunning) {

    scanner.stop().catch(function() {});

  }

});

  
window.addEventListener('message', function(event) {

  // Accept messages only from the original dashboard window.
  if (!window.opener || event.source !== window.opener) {
    return;
  }

  const data = event.data;

  if (!data || typeof data !== 'object') {
    return;
  }

  // Validate the scanner session token.
  if (data.token !== SCANNER_TOKEN) {
    return;
  }

  if (data.type === 'CHECKIN_RESULT') {

    displayCheckInResult(data);

    showStatus(
      'ok',
      'Check-in processed. Camera remains active and ready for the next participant.'
    );

  }

});



// ==================================================
// 11. INITIALIZE
// ==================================================

initializeScanner();

</script>

</body>

</html>
